name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile server.py telemetry.py observe_long_context.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.64.0
      - run: python -m playwright install --with-deps chromium
      - run: |
          python server.py --port 8090 --db /tmp/monitor-ci.sqlite3 > /tmp/monitor-ci.log 2>&1 &
          echo $! > /tmp/monitor-ci.pid
          python -c "import time,urllib.request; time.sleep(2); assert urllib.request.urlopen('http://127.0.0.1:8090/api/state').status == 200"
          python tests/browser_smoke.py
      - if: always()
        run: |
          if [ -f /tmp/monitor-ci.pid ]; then kill "$(cat /tmp/monitor-ci.pid)" || true; fi
